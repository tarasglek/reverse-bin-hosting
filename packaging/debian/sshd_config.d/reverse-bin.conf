# Per-app SSH sessions for the reverse-bin service user.
# Each key in /var/lib/reverse-bin/home/.ssh/authorized_keys must name its app:
#   restrict,pty,command="/usr/lib/reverse-bin/rb-ssh APP" ssh-ed25519 AAAA... comment
# The user's login shell is rb-ssh, which refuses anything else.
# This Match block ends with this file. Reload sshd after changes.
Match User reverse-bin
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	PermitTTY yes
